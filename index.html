<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Loop any section of a SoundCloud track from your browser.">
  <meta name="theme-color" content="#f6f6f3">
  <title>SoundCloud Looper</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f6f6f3;
      --surface: #ffffff;
      --text: #171717;
      --muted: #707070;
      --line: #e5e5e1;
      --accent: #f4511e;
      --success: #237a4b;
      --error: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input { font: inherit; }

    main {
      width: min(100% - 32px, 620px);
      margin: 0 auto;
      padding: 64px 0;
    }

    header { margin-bottom: 28px; }

    .brand {
      margin: 0 0 8px;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -.045em;
    }

    .intro {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .notice {
      margin-top: 16px;
      color: var(--muted);
      font-size: .84rem;
    }

    .notice::before {
      display: inline-block;
      width: 6px;
      height: 6px;
      margin: 0 8px 2px 0;
      border-radius: 50%;
      background: var(--accent);
      content: "";
    }

    .panel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
    }

    section { padding: 22px; }
    section + section { border-top: 1px solid var(--line); }

    h2 {
      margin: 0 0 16px;
      font-size: .82rem;
      font-weight: 650;
      letter-spacing: .02em;
      text-transform: uppercase;
    }

    .track-form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    input[type="url"],
    input[type="number"] {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: none;
      background: #fafaf8;
      color: var(--text);
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }

    input[type="url"] { padding: 11px 12px; }
    input[type="number"] { padding: 10px 38px 10px 11px; appearance: textfield; }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { margin: 0; appearance: none; }
    input::placeholder { color: #aaa; }

    input:focus-visible, button:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px #f4511e1f;
    }

    button {
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 650;
    }

    button:disabled { cursor: wait; opacity: .65; }

    .primary-button {
      padding: 11px 16px;
      background: var(--text);
      color: #fff;
      transition: background 140ms ease;
    }

    .primary-button:hover { background: #333; }

    .time-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: .78rem;
    }

    .time-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .time-field { position: relative; }

    .unit {
      position: absolute;
      top: 50%;
      right: 10px;
      color: #999;
      font-size: .72rem;
      pointer-events: none;
      transform: translateY(-50%);
    }

    .loop-footer {
      display: flex;
      gap: 14px;
      align-items: center;
      margin-top: 18px;
    }

    .status {
      min-height: 1.3em;
      margin: 0;
      color: var(--muted);
      font-size: .8rem;
    }

    .status[data-type="success"] { color: var(--success); }
    .status[data-type="error"] { color: var(--error); }

    .volume-row {
      display: grid;
      grid-template-columns: 1fr 42px;
      gap: 12px;
      align-items: center;
    }

    input[type="range"] {
      width: 100%;
      height: 3px;
      margin: 8px 0;
      appearance: none;
      border-radius: 99px;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      width: 16px;
      height: 16px;
      appearance: none;
      border: 2px solid var(--surface);
      border-radius: 50%;
      background: var(--text);
      box-shadow: 0 0 0 1px #d7d7d2;
    }

    input[type="range"]::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border: 2px solid var(--surface);
      border-radius: 50%;
      background: var(--text);
    }

    output { color: var(--muted); font-size: .8rem; text-align: right; }

    .player {
      margin-top: 12px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      line-height: 0;
    }

    iframe { display: block; width: 100%; height: 166px; border: 0; }
    [hidden] { display: none !important; }

    @media (max-width: 520px) {
      main { width: min(100% - 24px, 620px); padding: 36px 0; }
      .track-form, .time-grid { grid-template-columns: 1fr; }
      .track-form button { width: 100%; }
      .loop-footer { align-items: stretch; flex-direction: column; }
      .loop-footer button { order: 2; width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1 class="brand">SoundCloud Looper</h1>
      <p class="intro">Pick a track. Set a section. Keep it playing.</p>
      <p class="notice">Use the browser for ad-free looping; the phone app may play ads.</p>
    </header>

    <div class="panel">
      <section aria-labelledby="track-heading">
        <h2 id="track-heading">Track</h2>
        <form class="track-form" id="trackForm" novalidate>
          <label for="trackUrl" hidden>SoundCloud track URL</label>
          <input type="url" id="trackUrl" placeholder="Paste a SoundCloud link" aria-describedby="statusMessage" required>
          <button class="primary-button" id="loadTrackBtn" type="submit">Load</button>
        </form>
      </section>

      <section aria-labelledby="loop-heading">
        <h2 id="loop-heading">Loop</h2>
        <div class="time-grid">
          <div>
            <span class="label" id="start-label">Start</span>
            <div class="time-row" role="group" aria-labelledby="start-label">
              <div class="time-field">
                <input type="number" id="startMin" value="0" min="0" inputmode="numeric" aria-label="Start minutes">
                <span class="unit">min</span>
              </div>
              <div class="time-field">
                <input type="number" id="startSec" value="10" min="0" max="59.9" step="0.1" inputmode="decimal" aria-label="Start seconds">
                <span class="unit">sec</span>
              </div>
            </div>
          </div>

          <div>
            <span class="label" id="end-label">End</span>
            <div class="time-row" role="group" aria-labelledby="end-label">
              <div class="time-field">
                <input type="number" id="endMin" value="0" min="0" inputmode="numeric" aria-label="End minutes">
                <span class="unit">min</span>
              </div>
              <div class="time-field">
                <input type="number" id="endSec" value="20" min="0" max="59.9" step="0.1" inputmode="decimal" aria-label="End seconds">
                <span class="unit">sec</span>
              </div>
            </div>
          </div>
        </div>

        <div class="loop-footer">
          <button class="primary-button" id="updateLoopBtn" type="button">Apply</button>
          <p class="status" id="statusMessage" role="status" aria-live="polite"></p>
        </div>
      </section>

      <section aria-labelledby="volume-heading">
        <h2 id="volume-heading">Volume</h2>
        <div class="volume-row">
          <input type="range" id="volumeSlider" min="0" max="100" value="100" aria-label="Player volume">
          <output id="volumeDisplay" for="volumeSlider">100%</output>
        </div>
      </section>
    </div>

    <div class="player">
      <iframe id="sc-widget" title="SoundCloud player" scrolling="no" allow="autoplay" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/293&amp;color=%23f4511e"></iframe>
    </div>
  </main>

  <script src="https://w.soundcloud.com/player/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const widget = SC.Widget(document.getElementById('sc-widget'));
      const trackForm = document.getElementById('trackForm');
      const urlInput = document.getElementById('trackUrl');
      const loadBtn = document.getElementById('loadTrackBtn');
      const updateBtn = document.getElementById('updateLoopBtn');
      const statusMsg = document.getElementById('statusMessage');
      const volSlider = document.getElementById('volumeSlider');
      const volDisplay = document.getElementById('volumeDisplay');

      function getTotalSeconds(minId, secId) {
        const minutes = Math.max(0, parseFloat(document.getElementById(minId).value) || 0);
        const seconds = Math.max(0, parseFloat(document.getElementById(secId).value) || 0);
        return (minutes * 60) + seconds;
      }

      function formatTime(totalSeconds) {
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds - (minutes * 60);
        return `${minutes}:${seconds.toFixed(seconds % 1 ? 1 : 0).padStart(2, '0')}`;
      }

      function setStatus(message, type = '') {
        statusMsg.textContent = message;
        statusMsg.dataset.type = type;
      }

      function isSoundCloudUrl(value) {
        try {
          const url = new URL(value);
          return url.protocol === 'https:' && (url.hostname === 'soundcloud.com' || url.hostname.endsWith('.soundcloud.com'));
        } catch {
          return false;
        }
      }

      function updateSliderFill() {
        const value = Number(volSlider.value);
        volSlider.style.background = `linear-gradient(to right, var(--text) 0 ${value}%, #deded9 ${value}% 100%)`;
      }

      let loopStart = getTotalSeconds('startMin', 'startSec');
      let loopEnd = getTotalSeconds('endMin', 'endSec');

      volSlider.addEventListener('input', function () {
        volDisplay.value = `${volSlider.value}%`;
        updateSliderFill();
        widget.setVolume(volSlider.value);
      });

      trackForm.addEventListener('submit', function (event) {
        event.preventDefault();
        const url = urlInput.value.trim();

        if (!isSoundCloudUrl(url)) {
          setStatus('Enter a valid SoundCloud link.', 'error');
          urlInput.focus();
          return;
        }

        loadBtn.disabled = true;
        loadBtn.textContent = 'Loading…';
        setStatus('Loading…');
        widget.load(url, {
          auto_play: false,
          color: '#f4511e',
          callback: function () {
            widget.setVolume(volSlider.value);
            loadBtn.disabled = false;
            loadBtn.textContent = 'Load';
            setStatus('Ready to play.', 'success');
          }
        });
      });

      updateBtn.addEventListener('click', function () {
        const nextStart = getTotalSeconds('startMin', 'startSec');
        const nextEnd = getTotalSeconds('endMin', 'endSec');

        if (nextEnd <= nextStart) {
          setStatus('End must be later than start.', 'error');
          return;
        }

        loopStart = nextStart;
        loopEnd = nextEnd;
        widget.seekTo(loopStart * 1000);
        setStatus(`${formatTime(loopStart)}–${formatTime(loopEnd)}`, 'success');
      });

      widget.bind(SC.Widget.Events.READY, function () {
        widget.setVolume(volSlider.value);
        widget.bind(SC.Widget.Events.PLAY_PROGRESS, function (progress) {
          if ((progress.currentPosition / 1000) >= loopEnd) widget.seekTo(loopStart * 1000);
        });
      });

      updateSliderFill();
    });
  </script>
</body>
</html>
